name: CMake

on: [push]

env:
  BUILD_TYPE: Release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86_64
            runs-on: ubuntu-24.04
            cross: false
            cmake_extra: ""
            deb_arch: amd64

          - name: arm64
            runs-on: ubuntu-24.04-arm
            cross: false
            cmake_extra: ""
            deb_arch: arm64

          - name: arm32
            runs-on: ubuntu-24.04
            cross: true
            cmake_extra: >-
              -DCMAKE_TOOLCHAIN_FILE=$GITHUB_WORKSPACE/cmake/toolchain-arm32.cmake
              -DQt6Mqtt_DIR=/usr/lib/arm-linux-gnueabihf/cmake/Qt6Mqtt
              -DQt6SerialPort_DIR=/usr/lib/arm-linux-gnueabihf/cmake/Qt6SerialPort
            deb_arch: armhf

    runs-on: ${{ matrix.runs-on }}
    name: Build (${{ matrix.name }})

    steps:
    - uses: actions/checkout@v4

    - name: Prepare Environment
      shell: bash
      run: |
        sudo apt update
        sudo apt install -y git cmake build-essential \
          qt6-base-dev qt6-tools-dev qt6-base-private-dev \
          devscripts debhelper uuid-dev dh-make qt6-serialport-dev dh-exec pandoc

    - name: Prepare Cross-Compile Environment (arm32 only)
      if: matrix.cross
      shell: bash
      run: |
        sudo dpkg --add-architecture armhf

        # Pin all existing sources (sources.list and sources.list.d) to amd64
        # so apt does not try to fetch armhf from amd64-only mirrors
        sudo sed -i '/^deb /s/^deb /deb [arch=amd64] /' /etc/apt/sources.list || true
        sudo sed -i '/^deb /s/^deb /deb [arch=amd64] /' /etc/apt/sources.list.d/*.list 2>/dev/null || true
        for f in /etc/apt/sources.list.d/*.sources; do
          [ -f "$f" ] && sudo sed -i '/^Architectures:/d;/^Types: deb/{n;s/^/Architectures: amd64\n/}' "$f" || true
        done

        # Add ports.ubuntu.com as the armhf source (printf avoids heredoc indentation issues)
        printf 'deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports noble main restricted universe multiverse\n' | sudo tee    /etc/apt/sources.list.d/armhf-ports.list
        printf 'deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports noble-updates main restricted universe multiverse\n'  | sudo tee -a /etc/apt/sources.list.d/armhf-ports.list
        printf 'deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports noble-security main restricted universe multiverse\n' | sudo tee -a /etc/apt/sources.list.d/armhf-ports.list

        # Remove microsoft-prod.list — it has no arch pin and breaks multi-arch apt
        sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list

        sudo apt update
        sudo apt install -y \
          gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf \
          libqt6core6t64:armhf libqt6network6t64:armhf \
          qt6-base-dev:armhf qt6-serialport-dev:armhf \
          libssl-dev:armhf libudev-dev:armhf uuid-dev:armhf

        mkdir -p $GITHUB_WORKSPACE/cmake
        TOOLCHAIN=$GITHUB_WORKSPACE/cmake/toolchain-arm32.cmake
        printf 'set(CMAKE_SYSTEM_NAME Linux)\n'                                          | tee    "$TOOLCHAIN"
        printf 'set(CMAKE_SYSTEM_PROCESSOR arm)\n'                                       | tee -a "$TOOLCHAIN"
        printf 'set(CMAKE_C_COMPILER   arm-linux-gnueabihf-gcc)\n'                       | tee -a "$TOOLCHAIN"
        printf 'set(CMAKE_CXX_COMPILER arm-linux-gnueabihf-g++)\n'                      | tee -a "$TOOLCHAIN"
        printf 'set(CMAKE_FIND_ROOT_PATH /usr/lib/arm-linux-gnueabihf /usr/include)\n'   | tee -a "$TOOLCHAIN"
        printf 'set(CMAKE_FIND_ROOT_PATH_MODE_PROGRAM NEVER)\n'                          | tee -a "$TOOLCHAIN"
        printf 'set(CMAKE_FIND_ROOT_PATH_MODE_LIBRARY ONLY)\n'                           | tee -a "$TOOLCHAIN"
        printf 'set(CMAKE_FIND_ROOT_PATH_MODE_INCLUDE ONLY)\n'                           | tee -a "$TOOLCHAIN"
        printf 'set(CMAKE_FIND_ROOT_PATH_MODE_PACKAGE BOTH)\\n'                           | tee -a "$TOOLCHAIN"

    - name: Create Build Environment
      run: |
        cmake -E make_directory ${{github.workspace}}/build
        mkdir -p ${{github.workspace}}/artifacts

    - name: Build QtMqtt (native host)
      shell: bash
      working-directory: ${{github.workspace}}
      run: |
        git clone https://github.com/qt/qtmqtt
        cd qtmqtt
        QT_VERSION="$(qmake6 --version 2>/dev/null | sed -n 's/.*version\s*\([0-9]*\.[0-9]*\.[0-9]*\)\s*.*/\1/p')"
        git tag -l | grep -qE "^v${QT_VERSION}$" || \
          QT_VERSION=$(git tag -l | grep -oP "[0-9]+\.[0-9]+\.[0-9]+" | sort -V | tail -n 1)
        git checkout "v${QT_VERSION}"
        # Always build natively — cross build of qtmqtt requires QT_HOST_PATH
        # which is complex; instead we install the armhf runtime separately below
        cmake -B build-host -DCMAKE_INSTALL_PREFIX=/usr
        cmake --build build-host --parallel
        sudo cmake --install build-host
        # collect native deb
        dh_make -s -c lgpl -e none@none.de --createorig -y 2>/dev/null || true
        dpkg-buildpackage -b --no-sign || true
        find ${{github.workspace}} -maxdepth 1 -name '*.deb' -exec cp {} ${{github.workspace}}/artifacts/ \;

    - name: Install QtMqtt armhf runtime (arm32 cross only)
      if: matrix.cross
      shell: bash
      working-directory: ${{github.workspace}}/qtmqtt
      run: |
        # Cross-build qtmqtt for armhf using QT_HOST_PATH pointing at the
        # native install we just did
        cmake -B build-cross \
          -DCMAKE_TOOLCHAIN_FILE=${{github.workspace}}/cmake/toolchain-arm32.cmake \
          -DCMAKE_INSTALL_PREFIX=/usr \
          -DCMAKE_INSTALL_LIBDIR=/usr/lib/arm-linux-gnueabihf \
          -DQt6_DIR=/usr/lib/arm-linux-gnueabihf/cmake/Qt6 \
          -DCMAKE_PREFIX_PATH=/usr/lib/arm-linux-gnueabihf/cmake \
          -DQT_HOST_PATH=/usr \
          -DQT_HOST_PATH_CMAKE_DIR=/usr/lib/x86_64-linux-gnu/cmake
        cmake --build build-cross --parallel
        sudo cmake --install build-cross

    - name: Build LibSml
      shell: bash
      working-directory: ${{github.workspace}}
      run: |
        git clone https://github.com/volkszaehler/libsml
        cd libsml
        sed -i 's/.*\s-C\stest$//g' Makefile
        sed -i 's/.*\s-C\sexamples$//g' Makefile
        dpkg-buildpackage -b --no-sign -a${{ matrix.deb_arch }}
        sudo dpkg -i --force-architecture ../*.deb
        # collect debs for upload
        mkdir -p ${{github.workspace}}/artifacts
        cp ../*.deb ${{github.workspace}}/artifacts/

    - name: Build LibMBus
      shell: bash
      working-directory: ${{github.workspace}}
      run: |
        git clone https://github.com/rscada/libmbus
        cd libmbus
        ./build-deb.sh
        sudo dpkg -i --force-architecture ../*.deb
        # collect debs for upload
        cp ../*.deb ${{github.workspace}}/artifacts/

    - name: Configure CMake
      shell: bash
      working-directory: ${{github.workspace}}/build
      run: cmake $GITHUB_WORKSPACE -DCMAKE_BUILD_TYPE=$BUILD_TYPE ${{ matrix.cmake_extra }}

    - name: Build
      working-directory: ${{github.workspace}}/build
      shell: bash
      run: cmake --build . --config $BUILD_TYPE --parallel

    - name: Package
      working-directory: ${{github.workspace}}/build
      shell: bash
      run: |
        cpack
        cp ${{github.workspace}}/build/*.deb ${{github.workspace}}/artifacts/

    - name: Test
      if: ${{ !matrix.cross }}
      working-directory: ${{github.workspace}}/build
      shell: bash
      run: ctest -C $BUILD_TYPE --output-on-failure || true

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: SmartMeterToMqtt-${{ matrix.name }}
        path: ${{github.workspace}}/artifacts/*.deb
